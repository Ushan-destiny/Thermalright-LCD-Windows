<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooler Control Center</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #fff; display: flex; justify-content: center; padding-top: 50px; }
        .container { background-color: #2d2d2d; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 400px; }
        h1 { text-align: center; color: #00d9d9; margin-bottom: 30px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        select, input[type="color"] { width: 100%; padding: 10px; border-radius: 5px; border: none; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #00d9d9; color: #000; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #00b3b3; }
        .status { margin-top: 15px; text-align: center; font-size: 0.9em; color: #888; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Thermalright Control</h1>
        <form action="/update" method="POST">
            
            <div class="form-group">
                <label for="display_mode">Display Mode</label>
                <select name="display_mode" id="display_mode">
                    <option value="metrics" {% if current_mode == 'metrics' %}selected{% endif %}>CPU & GPU Metrics</option>
                    <option value="time" {% if current_mode == 'time' %}selected{% endif %}>Time Only</option>
                    <option value="alternate_time" {% if current_mode == 'alternate_time' %}selected{% endif %}>Cycle Time/Metrics</option>
                    <option value="cpu_temp" {% if current_mode == 'cpu_temp' %}selected{% endif %}>CPU Temp Only (Small Layout)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="led_color">Theme Color</label>
                <input type="color" id="led_color" name="led_color" value="{{ current_color }}">
            </div>

            <button type="submit">Apply Settings</button>
        </form>
        <div class="status">Changes apply instantly</div>
    </div>
</body>
</html>
